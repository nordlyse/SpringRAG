services:
  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: springrag
      POSTGRES_USER: springrag
      POSTGRES_PASSWORD: springrag
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springrag -d springrag"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # MIT image. Transitive dotenv is BSD-2-Clause and lru-cache is BlueOak-1.0.0.
  # Forecast data is Open-Meteo, CC BY 4.0. The AGPL API source is not vendored.
  open-meteo:
    image: ghcr.io/cmer81/open-meteo-mcp:2.5.2
    ports:
      - "3000:3000"

  spring-rag:
    build: ./spring-rag
    ports:
      - "8080:8080"
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_MODEL: llama3.2
      SPRING_RAG_DATA_DIRECTORY: /app/data
      SPRING_RAG_DATABASE_URL: jdbc:postgresql://pgvector:5432/springrag
      SPRING_RAG_DATABASE_USERNAME: springrag
      SPRING_RAG_DATABASE_PASSWORD: springrag
      SPRING_RAG_WEATHER_URL: http://open-meteo:3000
    volumes:
      - ./spring-rag/data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      open-meteo:
        condition: service_healthy

  rag-web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      SPRING_RAG_API: http://spring-rag:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./rag-web:/app
      - rag-web-modules:/app/node_modules
    depends_on:
      - spring-rag

volumes:
  ollama:
  pgvector-data:
  rag-web-modules:
