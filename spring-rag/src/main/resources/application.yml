spring:
  application:
    name: spring-rag
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}
        keep-alive: "-1s"
      embedding:
        model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
        keep-alive: "-1s"
    mcp:
      server:
        name: spring-rag-users
        version: 0.1.0
        protocol: STREAMABLE
        instructions: Look up a test user by id or username, and return that user's roles.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
      client:
        name: spring-rag
        version: 0.1.0
        request-timeout: 30s
        streamable-http:
          connections:
            open-meteo:
              url: ${SPRING_RAG_WEATHER_URL:http://localhost:3000}
              endpoint: /mcp
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        schema-name: ${SPRING_RAG_DATABASE_SCHEMA:public}
        table-name: ${SPRING_RAG_DATABASE_TABLE:vector_store}

spring-rag:
  data-directory: ${SPRING_RAG_DATA_DIRECTORY:data}
  directory-listener: true
  keep-models-loaded: true
  similarity-threshold: 0.32
  seed-test-users: true
  database:
    url: ${SPRING_RAG_DATABASE_URL:jdbc:postgresql://localhost:5432/springrag}
    username: ${SPRING_RAG_DATABASE_USERNAME:springrag}
    password: ${SPRING_RAG_DATABASE_PASSWORD:springrag}
    schema: ${SPRING_RAG_DATABASE_SCHEMA:public}
    table: ${SPRING_RAG_DATABASE_TABLE:vector_store}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
